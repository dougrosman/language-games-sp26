<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM Playground</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <div>
          <p class="eyebrow">Local Playground</p>
          <h1>GPT Output Lab</h1>
          <p class="subtitle">
            Experiment with prompt crafting and deterministic settings using GPT-4.1.
          </p>
        </div>
        <div class="chip">Model: GPT-4.1</div>
      </header>

      <section class="panel">
        <form id="prompt-form" class="grid">
          <div class="field full">
            <label for="prompt">Prompt</label>
            <textarea
              id="prompt"
              name="prompt"
              rows="8"
              placeholder="Ask the model anything..."
            >Explain the difference between deterministic and stochastic decoding in one paragraph.</textarea>
          </div>

          <div class="field">
            <label for="temperature">
              Temperature
              <span
                class="tooltip"
                data-tooltip="Controls randomness. Lower = more predictable. Higher = more creative."
                aria-label="Temperature tooltip"
              >?</span>
              <span id="temperature-value">0.7</span>
            </label>
            <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7" />
          </div>

          <div class="field">
            <label for="top_p">
              Top-p
              <span
                class="tooltip"
                data-tooltip="Limits choices to the most likely tokens. Lower = safer, higher = broader."
                aria-label="Top-p tooltip"
              >?</span>
              <span id="top_p-value">1.0</span>
            </label>
            <input type="range" id="top_p" min="0" max="1" step="0.05" value="1" />
          </div>

          <div class="field">
            <label for="max_output_tokens">
              Max output tokens
              <span
                class="tooltip"
                data-tooltip="Sets the maximum length of the response. Higher can mean longer answers and more cost."
                aria-label="Max output tokens tooltip"
              >?</span>
            </label>
            <input type="number" id="max_output_tokens" min="16" step="16" value="256" />
          </div>

          <div class="field">
            <label for="frequency_penalty">
              Frequency penalty
              <span
                class="tooltip"
                data-tooltip="Discourages repeating the same words. Higher = less repetition."
                aria-label="Frequency penalty tooltip"
              >?</span>
              <span id="frequency_penalty-value">0.0</span>
            </label>
            <input type="range" id="frequency_penalty" min="-2" max="2" step="0.1" value="0" />
          </div>

          <div class="field">
            <label for="presence_penalty">
              Presence penalty
              <span
                class="tooltip"
                data-tooltip="Encourages introducing new topics. Higher = more topic changes."
                aria-label="Presence penalty tooltip"
              >?</span>
              <span id="presence_penalty-value">0.0</span>
            </label>
            <input type="range" id="presence_penalty" min="-2" max="2" step="0.1" value="0" />
          </div>

          <div class="actions full">
            <button type="submit" id="submit-btn">Generate</button>
            <button type="button" class="ghost" id="reset-btn">Reset</button>
          </div>
        </form>
      </section>

      <section class="panel output">
        <div class="output-header">
          <h2>Model output</h2>
          <div class="meta" id="meta">Ready</div>
        </div>
        <pre id="output">Your response will appear here.</pre>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
